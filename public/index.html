<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="우리 동네 주말 나들이·행사를 캘린더로 — 아빠 오늘 어디가">
  <title>아빠 오늘 어디가</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon-192.png" type="image/png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<body>

    <main id="view"></main>
    <nav class="tabs" id="tabs"></nav>
    <section id="detail" hidden></section>
    <section id="search" hidden></section>
    <div id="toast" hidden></div>
    <section id="splash" aria-live="polite">

      <div class="sp-chat" id="spChat"></div>
      <p class="sp-brand">아빠 오늘 어디가</p>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
