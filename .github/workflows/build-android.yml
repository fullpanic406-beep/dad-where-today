name: 안드로이드 앱 빌드 (테스트용 APK)

on:
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # 앱 안에 넣을 데이터 스냅샷(오프라인 대비)은 이미 배포된 사이트에서 받는다. 공공 API 호출 한도를 쓰지 않는다.
      # (먼저 「행사 업데이트 및 배포」가 한 번 성공해 있어야 한다.) 평소 앱은 아래 배포 주소의 최신 데이터를 읽는다.
      - name: 배포된 데이터 받기 (앱 안 스냅샷)
        run: node scripts/fetch-live-data.js "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: 앱이 읽을 데이터 주소 설정 (GitHub Pages)
        run: node scripts/set-data-base.js "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - run: npx cap sync android

      - name: 디버그 APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: abba-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
