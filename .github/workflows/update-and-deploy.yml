name: 행사 업데이트 및 배포

on:
  schedule:
    - cron: '0 19 * * 0,1'   # 월·화 04:00 (한국 시간) — GitHub 는 UTC 기준(일·월 19:00). 월요일에 실패해도 화요일에 다시 받는다
  workflow_dispatch:         # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 현재 배포된 데이터 전체(행사·장소·건수)를 받아 둔다: 건수 급감 검사용, 그리고 선택 소스가 일시적으로 실패한 날 이전 데이터를 이어 쓰기 위함.
      # 처음 배포할 때는 없어도 된다.
      - name: 이전 배포 데이터 받기
        continue-on-error: true
        run: node scripts/fetch-live-data.js "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      # TourAPI 상세(운영 시간·요금) 캐시: 하루 호출 한도(약 1,000건)를 아끼려고 실행 사이에 이어 쓴다
      - name: TourAPI 캐시
        uses: actions/cache@v4
        with:
          path: .cache
          key: tourapi-${{ github.run_id }}
          restore-keys: tourapi-

      - name: 행사 수집 (서울 25개 구 전체)
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: |
          test -n "$SEOUL_API_KEY" || { echo "::error::SEOUL_API_KEY 시크릿이 설정되지 않았습니다"; exit 1; }
          node src/ingest.js

      # 체험객·관람객 얼굴이 나온 사진(초상권)을 걸러 기본 이미지로 바꾼다. 검사 결과는 .cache 에 이어 쓰므로 새 이미지만 내려받는다.
      # 감지가 실패해도 수집 결과는 그대로 배포되지 않도록(사진이 그대로 나가지 않게) 이 단계가 실패하면 중단한다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 얼굴이 나온 사진 거르기
        run: |
          pip install --quiet opencv-python-headless numpy
          mkdir -p .cache
          test -f .cache/yunet.onnx || curl -fsSL -o .cache/yunet.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          python scripts/filter-images.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # 수집이 실패하면 이 단계로 넘어가지 않으므로 기존 사이트가 그대로 유지된다.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
