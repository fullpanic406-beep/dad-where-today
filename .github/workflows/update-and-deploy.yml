name: 행사 업데이트 및 배포

on:
  schedule:
    - cron: '0 19 * * *'   # 매일 04:00 (한국 시간) — GitHub 는 UTC 기준
  workflow_dispatch:         # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 현재 배포된 meta.json(건수 급감 검사용)과 places.json(장소 소스가 실패한 날 이어 쓰기용)을 받아 둔다. 처음 배포할 때는 없어도 된다.
      - name: 이전 배포의 meta.json, places.json 받기
        continue-on-error: true
        run: |
          mkdir -p public/data
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          curl -fsSL "$SITE/meta.json" -o public/data/meta.json
          curl -fsSL "$SITE/places.json" -o public/data/places.json || true

      # TourAPI 상세(운영 시간·요금) 캐시: 하루 호출 한도(약 1,000건)를 아끼려고 실행 사이에 이어 쓴다
      - name: TourAPI 캐시
        uses: actions/cache@v4
        with:
          path: .cache
          key: tourapi-${{ github.run_id }}
          restore-keys: tourapi-

      - name: 행사 수집 (서울 25개 구 전체)
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: |
          test -n "$SEOUL_API_KEY" || { echo "::error::SEOUL_API_KEY 시크릿이 설정되지 않았습니다"; exit 1; }
          node src/ingest.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # 수집이 실패하면 이 단계로 넘어가지 않으므로 기존 사이트가 그대로 유지된다.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
